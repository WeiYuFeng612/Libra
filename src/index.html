<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Libra</title>
  </head>
  <body>
    <!-- Shared refraction map for Libra's liquid-glass primary actions. -->
    <svg
      aria-hidden="true"
      focusable="false"
      width="0"
      height="0"
      class="libra-liquid-glass-defs"
    >
      <defs>
        <filter
          id="libra-liquid-glass-refraction"
          x="-20%"
          y="-20%"
          width="140%"
          height="140%"
          color-interpolation-filters="sRGB"
        >
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.014 0.045"
            numOctaves="2"
            seed="19"
            result="liquid-noise"
          />
          <feColorMatrix
            in="liquid-noise"
            type="saturate"
            values="0"
            result="liquid-map"
          />
          <feDisplacementMap
            in="SourceGraphic"
            in2="liquid-map"
            scale="5"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
